title: |
  [雑記]
  k3s で Kubernetes クラスターを作ってみた
description: ''
published: '2026-10-04'

units:
  - description: |
      Kubernetes の勉強のために。
      いわゆる軽量ディストリビューションの一つである k3s でクラスターを作ってみる。

  # - outline:
  #     items:
  #       - title: ・構成
  #         as: arch
  #       - title: ・コード
  #         as: code
  #       - title: ・デプロイ
  #         as: deploy
  #       - title: ・ローカル開発
  #         as: local

  - title: 環境
    description: |
      AL2023 (ARM)

  - title: セットアップ
    description: |
      k3s をインストールして
      Kubernetes のクラスターをセットアップします。
    terminal: |
      # k3s
      curl -sfL https://get.k3s.io | sh -
      k3s kubectl get nodes

      # kubeconfig
      mkdir -p ~/.kube
      cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      chown $USER:$USER ~/.kube/config
      kubectl get nodes
  
  - image: size=(min) ./sk3ssetup.png

  - description: |
      次に pod を立ち上げます。

      ・Nginx
      ・Pythonのサンプルアプリ
      の2つを立ち上げます。

  - as: code
    code:
      open: nginx.yaml
      include:
        - ingress.yaml
        - nginx.yaml
        - python3app.yaml
      units:
        - description: |
            Nignx 
          mark: nginx.yaml:1
        - description: |
            Python3 のサンプルアプリ
          mark: python3app.yaml:1

  - description: |
      まずは Nginx の pod を立ち上げます
    terminal: |
      vim nginx.yaml
      kubectl apply -f nginx.yaml
      kubectl get pods
  - image: size=(min) snginx.png

  - description: |
      同じようにして Python3 のサンプルアプリの pod を立ち上げます
    terminal: |
      vim python3app.yaml
      kubectl apply -f python3app.yaml
      kubectl get pods
  - image: size=(min) spython3app.png

  - description: |
      続いて、
      クラスターの外からアクセスできるよう Ingress Controller にて Service へルーティングします
    terminal: |
      vim ingress.yaml
      kubectl apply -f ingress.yaml
      kubectl get ingress
  
  - image: size=(min) singress.png

  - description: |
      クラスター外から疎通確認します。
      EC2 の Public IP アドレスへ curl でリクエストを投げます。

  - image: size=(min) scurl.png

