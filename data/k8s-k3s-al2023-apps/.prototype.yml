title: |
  [雑記]
  k3s で Kubernetes クラスターを作ってみた
description: ''
published: '2026-10-04'

units:
  - description: |
      Kubernetes の勉強のために。
      いわゆる軽量ディストリビューションの一つである k3s でクラスターを作ってみる。
  
  - title: 環境
    description: |
      AL2023 (ARM)

  - title: セットアップ
    description: |
      kubectl をインストールします。
      次に k3s をセットアップします。
    terminal: |
      ## install

  - description: |
      次に pod を立ち上げます。

      ・Nginx
      ・Pythonのサンプルアプリ
      の2つを立ち上げます。


