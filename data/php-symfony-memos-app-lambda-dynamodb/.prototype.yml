        - description: |
            SAM のテンプレート。
            DynamoDB テーブルと Lambda 関数を作成します。
          mark: template.yaml:1

  - title: ローカル開発環境
    description: |
      Docker でローカル開発環境を立ち上げます。
      DynamoDB のエミュレータとして DynamoDB Local を使います。
    terminal: |
      docker compose up

  - description: |
      コンテナが立ち上がったら app コンテナへ乗り込んでテーブルを作成しましょう。
    terminal: |
      docker compose exec app bash

  - terminal: |
      # テーブル作成 (マイグレーション代わり)
      php bin/console app:dynamodb:create-table

      # シードデータの投入
      php bin/console app:fixtures:load

  - title: 動作確認
    description: |
      localhost:8000 にアプリケーションが立ち上がります。
      localhost:8002 で dynamodb-admin からテーブルの中身も確認できます。
    image: size=(min) slist.png

  - description: |
      メモ作成画面です
    image: size=(min) screate.png

  - description: |
      バリデーションもされてますね
    image: size=(min) svalidate.png

  - title: Lambda へのデプロイ
    description: |
      SAM でビルド & デプロイします。コンテナイメージのまま Lambda Web Adapter 経由で動かしています。
    terminal: |
      sam build
      sam deploy --guided

  - title: Links
    links:
      - title: https://symfony.com/
        url: https://symfony.com/
      - title: https://github.com/awslabs/aws-lambda-web-adapter
        url: https://github.com/awslabs/aws-lambda-web-adapter
