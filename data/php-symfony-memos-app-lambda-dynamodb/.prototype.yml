title: |
  [PHP]
  Symfony でメモ帳アプリを作り Lambda でホストする
description: ''
published: '2026-09-26'

units:
  - description: |
      Symfony でメモ帳アプリを作り AWS Lambda でホストします。
      データは DynamoDB へ保存します。

  - title: 構成
    description: |
      Lambda (Web Adapter + Function URL)
      DynamoDB
    image: size=(min) ./sarch.png

  - description: |
      クライアントは Lambda Function URL を叩きます。
      すると Lambda が起動します。Symfony へリクエストが流れ DynamoDB へ接続します。
    image: size=(min) ./sexample.png

  - code:
      open: src/Controller/MemoController.php
      include:
        - assets/styles/app.css
        - assets/app.js
        - bin/console
        - bin/dev
        - config/packages/asset_mapper.yaml
        - config/packages/cache.yaml
        - config/packages/csrf.yaml
        - config/packages/debug.yaml
        - config/packages/framework.yaml
        - config/packages/monolog.yaml
        - config/packages/property_info.yaml
        - config/packages/routing.yaml
        - config/packages/security.yaml
        - config/packages/symfonycasts_tailwind.yaml
        - config/packages/twig.yaml
        - config/packages/validator.yaml
        - config/packages/web_profiler.yaml
        - config/routes/framework.yaml
        - config/routes/security.yaml
        - config/routes/web_profiler.yaml
        - config/bundles.php
        - config/preload.php
        - config/reference.php
        - config/routes.yaml
        - config/services.yaml
        - public/index.php
        - src/Command/SetupLocalCommand.php
        - src/Controller/HomeController.php
        - src/Controller/MemoController.php
        - src/Controller
        - src/Entity/Memo.php
        - src/Form/MemoType.php
        - src/Infrastructure/Aws/DynamoDbClientFactory.php
        - src/Repository/MemoRepository.php
        - src/Kernel.php
        - src
        - templates/form/theme.html.twig
        - templates/home/index.html.twig
        - templates/memo/_delete_form.html.twig
        - templates/memo/_form.html.twig
        - templates/memo/edit.html.twig
        - templates/memo/new.html.twig
        - templates/memo/show.html.twig
        - templates/base.html.twig
        - .env
        - .gitignore
        - composer.json
        - composer.lock
        - docker-compose.yml
        - Dockerfile
        - importmap.php
        - symfony.lock
        - template.yaml
        - samconfig.toml
      units:
        - description: |
            SAM のテンプレート。
            DynamoDB テーブルと Lambda 関数を作成します。
          mark: template.yaml:1
        - description: |
            ローカル開発用のスクリプト。
            DynamoDB Local へテーブルを作成します。
          mark: src/Command/DynamoDbLocalSetupCommand.php:38

  - title: デプロイ
    description: |
      SAM CLI を使ってデプロイします。
      構築されるリソースは Lambda, DynamoDB です。※template.yamlへ記載
    terminal: |
      sam build
      sam deploy --guided
  - image: size=(min) ./sdeployguide.png
  
  - description: |
      コマンドを実行すると、
      Lambda 関数が作成されました。
    image: size=(min) ./slambda.png

  - description: |
      関数URLが有効化されてます。
    image: size=(min) ./slambdafunctionurl.png
  
  - title: 動作確認
    description: |
      関数URLを curl で叩きます。
    
    terminal: |
      # 作成
      curl -X POST 'https://xxx.on.aws/memos' --json '{"title":"aaa","description":"aaa aaa"}'

      # 一覧
      curl 'https://xxx.on.aws/memos'
      
      # 一覧（キーワード検索）
      curl 'https://xxx.on.aws/memos?q=aaa'
      
      # 詳細
      curl 'https://xxx.on.aws/memos/<id>'

      # 更新
      curl -X PUT 'https://xxx.on.aws/memos/<id>' --json '{"title":"aaa","description":"ccc ccc"}'

      # 削除
      curl -X DELETE 'https://xxx.on.aws/memos/<id>'

  - cap: ローカル開発
    description: |
      ローカル開発は docker compose で行います。
      DynamoDB のエミュレータとして DynamoDB Local を立ち上げます。
    terminal: |
      docker compose up

  - description: |
      なお SAM CLI を使っているので SAM Local にて開発する手もあります。
      が Dynamo DB Local への接続/環境管理にめんどくささを感じたため、あえて docker compose にしました。

  - title: ローカル開発環境の立ち上げ
    description: |
      まずはコンテナを立ち上げましょう。
      その次に DynamoDB Local のセットアップをします。
    terminal: |
      # コンテナ立ち上げ
      docker compose up

      # DynamoDB Local のセットアップ
      docker compose exec app composer run setup:local

  - cap: 終わり
    title: 感想
    description: |
      コールドスタート何とかならんか..
