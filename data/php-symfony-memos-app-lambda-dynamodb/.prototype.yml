title: |
  [PHP]
  Symfony でメモ帳アプリを作り Lambda でホストする
description: ''
published: '2026-09-26'

units:
  - description: |
      Symfony でメモ帳アプリを作り AWS Lambda でホストします。
      データは DynamoDB へ保存します。

  - title: 構成
    description: |
      Lambda (Web Adapter + Function URL)
      DynamoDB
    image: size=(min) ./sarch.png

  - description: |
      クライアントは Lambda Function URL を叩きます。
      すると Lambda が起動します。Symfony へリクエストが流れ DynamoDB へ接続します。
    image: size=(min) ./sexample.png

  - code:
      open: src/Controller/MemoController.php
      include:
        - bin/console
        - bin/dev
        - config/packages/cache.yaml
        - config/packages/debug.yaml
        - config/packages/framework.yaml
        - config/packages/monolog.yaml
        - config/packages/property_info.yaml
        - config/packages/routing.yaml
        - config/packages/validator.yaml
        - config/routes/framework.yaml
        - config/bundles.php
        - config/preload.php
        - config/reference.php
        - config/routes.yaml
        - config/services.php
        - public/index.php
        - src/Command/SetupLocalCommand.php
        - src/Controller/AppController.php
        - src/Controller/MemoController.php
        - src/Controller
        - src/Entity/Memo.php
        - src/EventListener/ApiExceptionListener.php
        - src/Repository/MemoRepository.php
        - src/Dto/EmptyResponse.php
        - src/Dto/MemoRequest.php
        - src/Dto/MemoResponse.php
        - src/Kernel.php
        - src
        - .dockerignore
        - .env
        - .gitignore
        - Caddyfile
        - composer.json
        - composer.lock
        - docker-compose.yml
        - Dockerfile
        - symfony.lock
        - template.yaml
        - samconfig.toml
      units:
        - description: |
            Controller
          mark: src/Controller/MemoController.php:16
        - description: |
            MapQueryParameter にてクエリパラメータをマッピングします
          links:
            - title: https://symfony.com/blog/new-in-symfony-6-3-query-parameters-mapper
              url: https://symfony.com/blog/new-in-symfony-6-3-query-parameters-mapper
          mark: src/Controller/MemoController.php:24
        - description: |
            DTO。リクエストボディをマッピングします。またレスポンスボディの構築にもDTOを使います
          links:
            - title: https://symfony.com/doc/current/object_mapper.html
              url: https://symfony.com/doc/current/object_mapper.html
          mark: src/Controller/MemoController.php:45
        - description: |
            Repository。DynamoDB へデータを保存するため Doctrine ORM は使いません
          mark: src/Repository/MemoRepository.php:10
        - description: |
            SAM のテンプレート。DynamoDB テーブルと Lambda 関数を作成します
          mark: template.yaml:1
        - description: |
            ローカル開発用のスクリプト。DynamoDB Local へテーブルを作成します
          mark: src/Command/SetupLocalCommand.php:38

  - title: デプロイ
    description: |
      SAM CLI にてデプロイします。
      構築されるリソースは Lambda, DynamoDB です。※template.yamlへ記載
    terminal: |
      sam build
      sam deploy --guided
  - image: size=(min) ./sdeployguide.png
  
  - description: |
      コマンドを実行すると、
      Lambda 関数が作成されました。
    image: size=(min) ./slambda.png

  - description: |
      関数URLが有効化されてます。
    image: size=(min) ./slambdafunctionurl.png
  
  - title: 動作確認
    description: |
      関数URLを curl で叩きます。
    
    terminal: |
      # 作成
      curl -X POST 'https://xxx.on.aws/memos' --json '{"title":"aaa","description":"aaa aaa"}'

      # 一覧
      curl 'https://xxx.on.aws/memos'
      
      # 一覧（キーワード検索）
      curl 'https://xxx.on.aws/memos?q=aaa'
      
      # 詳細
      curl 'https://xxx.on.aws/memos/<id>'

      # 更新
      curl -X PUT 'https://xxx.on.aws/memos/<id>' --json '{"title":"aaa","description":"ccc ccc"}'

      # 削除
      curl -X DELETE 'https://xxx.on.aws/memos/<id>'

  - cap: ローカル開発
    description: |
      ローカル開発は docker compose で行います。
      DynamoDB のエミュレータとして DynamoDB Local を立ち上げます。
    terminal: |
      docker compose up

  - description: |
      なお SAM CLI を使っているので SAM Local にて開発する手もあります。
      が Dynamo DB Local への接続/環境管理にめんどくささを感じたため、あえて docker compose にしました。

  - title: ローカル開発環境の立ち上げ
    description: |
      まずはコンテナを立ち上げましょう。
      その次に DynamoDB Local のセットアップをします。
    terminal: |
      # コンテナ立ち上げ
      docker compose up

      # DynamoDB Local のセットアップ
      docker compose exec app composer run setup:local

  - cap: 終わり
    title: 感想
    description: |
      コールドスタート何とかならんか..
