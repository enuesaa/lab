title: |
  [PHP]
  Symfony を Lambda でホストして DynamoDB へ接続する
description: ''
published: '2026-09-14'

units:
  - description: |
      Symfony でメモ帳アプリを作り AWS Lambda でホストします。
      データは DynamoDB へホストします。

  - title: 構成
    description: |
      Lambda (Web Adapter + Function URL)
      DynamoDB

  - title: バージョン
    description: |
      PHP 8.4
      Symfony 8.1

