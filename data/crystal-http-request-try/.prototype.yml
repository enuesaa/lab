title: |
  [雑記]
  Crystal で HTTP リクエストしてみる
description: ''
published: '2026-11-10'

units:
  - description: |
      勉強がてら Crystal Lang に触れました。
      試しに HTTP リクエストしてみます。

  - title: インストール
    description: |
      Crystal Lang のインストールは HomeBrew で行いました。
    terminal: |
      brew install crystal
  - description: バージョン情報
    image: size=(min) version.png

  - title: Links
    links:
      - title: https://crystal-lang.org/
        url: https://crystal-lang.org/
      - title: https://crystal-lang.org/install/#macos
        url: https://crystal-lang.org/install/#macos

  - code:
      open: mycurl.cr
      units:
        - description: |
            OptionParser でコマンドライン引数をパースします
          mark: mycurl.cr:2
          links:
            - title: https://crystal-lang.org/api/1.22.2/OptionParser.html
              url: https://crystal-lang.org/api/1.22.2/OptionParser.html

  - description: |
      下記のコマンドで実行できます
    terminal: |
      crystal run mycurl.cr -- 'https://example.com' -i

  - title: ビルド
    description: |
      ビルドします。
      コマンドを実行すると `./mycurl` にバイナリが作られます。
  - terminal: |
      crystal build mycurl.cr --release --no-debug

  - description: |
      バイナリを実行してみましょう。
    image: size=(min) run.png
