title: |
  [雑記]
  SQLite + SeaORM でメモ帳CLIを作る
description: ''
published: '2026-08-29'

units:
  - description: |
      メモ帳CLIを作ってみました。試しに。
      雑コードです。

      ローカルのSQLiteへメモを書き込みます。
    image: size=(min) memm.gif

  - title: 構成
    description: |
      言語としてはRustを、
      ORMとしてはSeaORMを選定してます。

      ・Tokio
      ・SeaORM (SQLx)
      ・SQLite
      ・Clap

  - code:
      open: src/main.rs
      include:
        - libeditor/src/edit.rs
        - libeditor/src/lib.rs
        - libeditor/src/prompt.rs
        - libeditor/Cargo.toml
        - src/cli/handler/delete.rs
        - src/cli/handler/list.rs
        - src/cli/handler/mod.rs
        - src/cli/handler/new.rs
        - src/cli/args.rs
        - src/cli/mod.rs
        - src/db/migration/m20250801_000001_create_memos_table.rs
        - src/db/migration/mod.rs
        - src/db/connect.rs
        - src/db/memos.rs
        - src/db/mod.rs
        - src/service/memo.rs
        - src/service/mod.rs
        - src/main.rs
        - src
        - .gitignore
        - Cargo.lock
        - Cargo.toml

      units:
        - description: Clap でコマンドライン引数をパースします
          mark: src/main.rs:10
        - description: ここで SQLite へ接続します
          mark: src/db/connect.rs:10
        - description: プロンプト・エディタは、いろんなところで使うため、別のCrateに切り出します
          mark: libeditor/Cargo.toml:15

  - title: ビルド
    terminal: |
      cargo build

  - title: 実行
    image: size=(min) helptext.png

  - title: おわり
    description: |
      SeaORMを使ってみたくて試しに作ってみた。が、

      例えば
      ・DIするか
      ・DIコンテナどうしよう
      ・ディレクトリ構成はどうあるべきか
      ・マイグレーションどうしようか

      など考えることが思ったより多い。      
      そのためここらで一旦書き出した。
