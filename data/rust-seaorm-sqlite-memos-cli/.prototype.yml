title: |
  [雑記]
  SQLite + SeaORM でメモ帳CLIを作る
description: ''
published: '2026-08-30'

units:
  - description: |
      雑コードです。
      試しにメモ帳CLIを作ってみました。

      ローカルのSQLiteへメモを書き込みます。

  - title: 構成
    description: |
      言語としてはRustを、
      ORMとしてはSeaORMを選定してます。

      ・Tokio
      ・SeaORM (SQLx)
      ・SQLite
      ・Clap

  - code:
      open: src/main.rs
      include:
        - libeditor/src/edit.rs
        - libeditor/src/lib.rs
        - libeditor/src/prompt.rs
        - libeditor/Cargo.toml
        - src/cli/handler/delete.rs
        - src/cli/handler/list.rs
        - src/cli/handler/mod.rs
        - src/cli/handler/new.rs
        - src/cli/args.rs
        - src/cli/mod.rs
        - src/db/migration/m20250801_000001_create_memos_table.rs
        - src/db/migration/mod.rs
        - src/db/connect.rs
        - src/db/memos.rs
        - src/db/mod.rs
        - src/service/memo.rs
        - src/service/mod.rs
        - src/main.rs
        - src
        - .gitignore
        - Cargo.lock
        - Cargo.toml

      units:
        - description: プロンプト・エディタは、いろんなところで使うため、別のCrateに切り出してます。
