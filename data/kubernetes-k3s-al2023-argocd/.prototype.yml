title: |
  [雑記]
  K3s で立ち上げたクラスターへ ArgoCD でデプロイしてみる
description: ''
published: '2026-10-10'

units:
  - description: |
      Kubernetes の勉強のために。
      K3s で Kubernetes クラスターを作り、そこへ ArgoCD でデプロイしてみる。

  # - title: 前提
  #   description: |
  #     Kubernetes 初心者の雑記です。

  #     EC2 でインスタンス（AL2023）を立ち上げ
  #     K3s でクラスターをセットアップして、Service を立ち上げてみます。

