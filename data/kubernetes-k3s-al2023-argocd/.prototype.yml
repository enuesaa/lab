title: |
  [雑記]
  K3s で立ち上げたクラスターへ ArgoCD でデプロイしてみる
description: ''
published: '2026-10-10'

units:
  - description: |
      Kubernetes の勉強のために。
      K3s で Kubernetes クラスターを作り、そこへ ArgoCD でデプロイしてみる。

  - title: 前提
    description: |
      Kubernetes 初心者の雑記です。

      EC2 インスタンス (AL2023) にて、K3s で Kubernetes クラスターを立ち上げます。
      また ArgoCD をセットアップします。

  - outline:
      items:
        - title: ・クラスターの立ち上げ
          as: setup
        - title: ・ArgoCD の設定
          as: argocd
        - title: ・リポジトリを登録
          as: argocd-addrepo
        - title: ・Application を作成
          as: argocd-addapp
        - title: ・Pod の数を増やしてみる
          as: add-replicas

  - as: setup
    cap: クラスターの立ち上げ
    description: |
      まずは K3s をインストールして
      Kubernetes のクラスターをセットアップします
    terminal: |
      # k3s
      curl -sfL https://get.k3s.io | sh -
      k3s kubectl get nodes

      # kubeconfig
      mkdir -p ~/.kube
      cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      chown $USER:$USER ~/.kube/config
      kubectl get nodes

  - description: |
      続いて ArgoCD をセットアップします
    terminal: |
      kubectl create namespace argocd
      kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      
      # Running になるまで待つ
      kubectl get pods -n argocd

  - description: |
      Links
    links:
      - title: https://docs.k3s.io/quick-start
        url: https://docs.k3s.io/quick-start
      - title: https://argo-cd.readthedocs.io/en/stable/operator-manual/installation/
        url: https://argo-cd.readthedocs.io/en/stable/operator-manual/installation/

  - as: argocd
    cap: ArgoCD の設定
    description: |
      UI へログインして ArgoCD の設定を進めます。

      まずはログインするためのパスワードを取得します。
      またクラスター外からアクセスできるようポートフォワードします。
    terminal: |
      # ArgoCD の admin ユーザーのパスワードを取得
      kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

      # ArgoCD の UI をポートフォワード
      kubectl -n argocd port-forward --address 0.0.0.0 svc/argocd-server 8080:443

  - description: |
      https://<EC2のPublicIPアドレス>:8080 を開く
      ・Username へ「admin」を。
      ・Password へ前ステップで取得したパスワードを入力。

  - as: argocd-addrepo
    title: リポジトリを登録
    description: |
      Git リポジトリを登録します。
      Settings ページへ行き Repositories を選択。
    image: size=(min) ./saddrepo1.png
  - description: |
      Connect Repo ボタンを押します。
    image: size=(min) ./saddrepo2.png
  - description: |
      リポジトリの情報を入力し保存します。
    image: size=(min) ./saddrepo3.png

  - as: argocd-addapp
    title: Application を作成
    description: |
      Applications ページへ行き New App ボタンを押します。
    image: size=(min) ./screateapp1.png
  - description: |
      アプリケーション名を入力して
    image: size=(min) ./screateapp2.png
  - description: |
      Git リポジトリや Destination も選択。
      CREATE ボタンを押します。
    image: size=(min) ./screateapp3.png
  - description: |
      するとアプリケーションが作成されました。
    image: size=(min) ./screateapp-created.png
  - image: size=(min) ./screateapp-end.png
  - description: |
      Kubernetes クラスターへ構成を反映するため、
      Sync ボタンを押します。
    image: size=(min) ./sappsync.png

  - description: |
      Pod が立ち上がりました。
      Nginx の Pod は2つ立ち上がってます。
    image: size=(min) ./sappsynced.png

  - as: add-replicas
    cap: Pod の数を増やしてみる
    description: |
      Nginx の Pod を増やしてみます。
    image: size=(min) ./saddpod5.png
  - description: |
      しばらくすると ArgoCD にてステータスが変わります。
      差分も確認できました。
    image: size=(min) ./saddpod5-outofsync.png
  - description: |
      Sync ボタンを押します。
    image: size=(min) ./saddpod5-sync.png
  - description: |
      しばらく待ちます。
      Nginx の Pod が5つになりました。
    image: size=(min) ./saddpod5-synced.png
