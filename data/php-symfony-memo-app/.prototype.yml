title: |
  [PHP]
  Symfony でメモ帳を作る
description: ''
published: '2026-08-11'

units:
  - description: |
      勉強のために Symfony でメモ帳アプリを作ってみました。
      コードを置きます。
    image: size=(min) sapp.png
  
  - title: バージョン
    description: |
      PHP 8.4
      Symfony 8.1
      MariaDB 11

  - code:
      open: src/Controller/MemoController.php
      include:
        - assets/styles/app.css
        - assets/app.js
        - bin/console
        - bin/dev
        - bin/phpunit
        - config/packages/asset_mapper.yaml
        - config/packages/cache.yaml
        - config/packages/csrf.yaml
        - config/packages/debug.yaml
        - config/packages/doctrine_migrations.yaml
        - config/packages/doctrine.yaml
        - config/packages/framework.yaml
        - config/packages/monolog.yaml
        - config/packages/property_info.yaml
        - config/packages/routing.yaml
        - config/packages/security.yaml
        - config/packages/symfonycasts_tailwind.yaml
        - config/packages/twig.yaml
        - config/packages/validator.yaml
        - config/packages/web_profiler.yaml
        - config/routes/framework.yaml
        - config/routes/security.yaml
        - config/routes/web_profiler.yaml
        - config/bundles.php
        - config/preload.php
        - config/reference.php
        - config/routes.yaml
        - config/services.yaml
        - migrations/Version20260808061339.php
        - public/.htaccess
        - public/favicon.ico
        - public/index.php
        - src/Controller/HomeController.php
        - src/Controller/MemoController.php
        - src/Controller
        - src/Entity/Memo.php
        - src/Form/MemoType.php
        - src/Repository/MemoRepository.php
        - src/Kernel.php
        - src
        - templates/form/theme.html.twig
        - templates/home/index.html.twig
        - templates/memo/_delete_form.html.twig
        - templates/memo/_form.html.twig
        - templates/memo/edit.html.twig
        - templates/memo/new.html.twig
        - templates/memo/show.html.twig
        - templates/base.html.twig
        - tests/bootstrap.php
        - .env
        - .gitignore
        - composer.json
        - composer.lock
        - docker-compose.yml
        - Dockerfile
        - importmap.php
        - symfony.lock
      units:
        - description: Controller
          mark: src/Controller/MemoController.php:15
          links:
            - title: https://symfony.com/doc/current/controller.html
              url: https://symfony.com/doc/current/controller.html
        - description: EntityManager
          mark: src/Controller/MemoController.php:18
          links:
            - title: https://symfony.com/doc/current/doctrine.html#persisting-objects-to-the-database
              url: https://symfony.com/doc/current/doctrine.html#persisting-objects-to-the-database
        - description: EntityValueResolver
          mark: src/Controller/MemoController.php:42
          links:
            - title: https://symfony.com/doc/current/doctrine.html#automatically-fetching-objects-entityvalueresolver
              url: https://symfony.com/doc/current/doctrine.html#automatically-fetching-objects-entityvalueresolver
        - description: Entity
          mark: src/Entity/Memo.php:15
          links:
            - title: https://symfony.com/doc/current/doctrine.html#creating-an-entity-class
              url: https://symfony.com/doc/current/doctrine.html#creating-an-entity-class
        - description: マイグレーション
          mark: migrations/Version20260808061339.php:13
          links:
            - title: https://symfony.com/doc/current/doctrine.html#migrations-creating-the-database-tables-schema
              url: https://symfony.com/doc/current/doctrine.html#migrations-creating-the-database-tables-schema

  - title: 立ち上げ
    description: |
      ローカル開発環境を立ち上げます。
    terminal: |
      docker compose up

  - description: |
      コンテナが立ち上がったら app コンテナへ乗り込んでマイグレーションをしましょう。
    terminal: |
      php bin/console doctrine:migrations:migrate

  - title: 動作確認
    description: |
      localhost:8000 にアプリケーションが立ち上がります。
    image: size=(min) slist.png

  - description: |
      メモ作成画面です
    image: size=(min) screate.png
  
  - description: |
      バリデーションもされてますね
    image: size=(min) svalidate.png
  
  - description: |
      Symfony Profiler の画面です。
      これは便利ですね。
    image: size=(min) sprofiler.png

