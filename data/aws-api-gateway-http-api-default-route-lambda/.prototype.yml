title: |
  AWS API Gateway HTTP API のデフォルトルートの挙動を確認してみた
description: ''
published: '2026-07-25'

units:
  - description: |
      API Gateway HTTP API にはデフォルトルートなるルーティングがあります。
      これは他のどのルートにもマッチしなかったときに呼ばれるいわゆるワイルドカード的な存在です。

      API Gateway REST API にはこのような仕組みは存在しません。
      どのような挙動をするのか把握するために検証してみました。

  - outline:
      items:
        - title: ・構成
          as: arch
        - title: ・コード
          as: code

  - as: arch
    title: 構成
  - as: code
    code:
      open: apigateway_api.tf
      include:
        - apigateway_api.tf
        - lambda_role.tf
        - lambda.tf
        - main.tf
        - outputs.tf
        - variables.tf
      units:
        - description: HTTP API を使います
          mark: apigateway_api.tf:3
        - description: デフォルトルートです
          mark: apigateway_api.tf:7
        - description: デフォルトルートのバックエンドとなる Lambda です
          mark: lambda.tf:1

  - title: 検証
    description: |
      curl -X POST <url>
      curl -X GET <url>
      curl -X OPTIONS <url>
      curl -X HEAD <url>
      curl -X QUERY <url>
