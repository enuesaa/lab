title: |
  [AWS] API Gateway
  HTTP API のデフォルトルートの挙動を確認してみた
description: ''
published: '2026-07-25'

units:
  - description: |
      HTTP API にはデフォルトルートなるルーティングがあります。
      これは他のどのルートにもマッチしなかったときに呼ばれるいわゆるワイルドカード的な存在です。

      REST API にはこのような仕組みは存在しません。
      どのような挙動をするのか確認してみました。

  - outline:
      items:
        - title: ・構成
          as: arch
        - title: ・AWSコンソール
          as: awsconsole
        - title: ・Terraform
          as: code

  - as: arch
    title: 構成
    description: API Gateway と Lambda を作ります
    image: size=(min) arch.png
  
  - description: |
      GET /hello とデフォルトルート ($default) の2つを用意し、
      どちらのルートも Lambda へリクエストを向けます
 
  - as: awsconsole
    title: AWSコンソール
    image: size=(min) awsconsole.png

  - as: code
    title: Terraform
    code:
      open: apigateway_api.tf
      include:
        - apigateway_api.tf
        - lambda_role.tf
        - lambda.tf
        - main.tf
        - outputs.tf
        - variables.tf
      units:
        - description: HTTP API を使います
          mark: apigateway_api.tf:3
        - description: デフォルトルートです
          mark: apigateway_api.tf:7
        - description: デフォルトルートのバックエンドとなる Lambda です
          mark: lambda.tf:1

  - title: 検証
    description: |
      curl -X POST <url>
      curl -X GET <url>
      curl -X OPTIONS <url>
      curl -X HEAD <url>
      curl -X QUERY <url>
