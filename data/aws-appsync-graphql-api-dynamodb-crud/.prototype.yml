title: |
  [Terraform]
  AppSync GraphQL API + DynamoDB で CRUD する
description: ''
published: '2026-07-13'

units:
  - description: |
      AppSync を DynamoDB に繋げて CRUD しました。
      Terraform のサンプルコードを載せます。

  - outline:
      items:
        - title: ・構成
          as: arch
        - title: ・GraphQL スキーマ
          as: gqlschema
        - title: ・コード
          as: code
        - title: ・動作確認
          as: check

  - as: arch
    title: 構成
    image: size=(min) arch.png

  - as: gqlschema
    title: GraphQL スキーマ
    description: |
      スキーマはこんな感じです。
      Create/Read/Update/Deleteします。
    inline:
      open: appsync_schema.graphql
  
  - as: code
    code:
      open: appsync.tf
      include:
        - appsync_datasource_role.tf
        - appsync_datasource.tf
        - appsync_logging_role.tf
        - appsync_resolver_notes.tf
        - appsync_resolver_note.tf
        - appsync_resolver_create_note.tf
        - appsync_resolver_update_note.tf
        - appsync_resolver_delete_note.tf
        - appsync_schema.graphql
        - appsync.tf
        - dynamodb_table.tf
        - main.tf
        - variables.tf
      units:
        - description: AppSync GraphQL API を立てます。authentication_type は API キーにしました。コンソールで API キーを発行しリクエストに付与すると API にアクセスできます
          mark: appsync.tf:1
          links:
            - url: https://docs.aws.amazon.com/ja_jp/appsync/latest/devguide/security-authz.html
              title: https://docs.aws.amazon.com/ja_jp/appsync/latest/devguide/security-authz.html
        - description: ロギング設定です。とりあえず全部ログに出力します
          mark: appsync.tf:8
        - description: |
            GraphQL のスキーマです。CRUDします
            ・notes
            ・note
            ・createNote
            ・updateNote
            ・deleteNote
          mark: appsync_schema.graphql:1
        - description: |
            createNote のリゾルバーです
          mark: appsync_resolver_create_note.tf:1
        - description: DyanmoDB の設定です
          mark: dynamodb_table.tf:1

  - description: |
      これを apply します
    terminal: |
      $ terraform plan | grep will
      Terraform will perform the following actions:
        # aws_appsync_datasource.dynamodb will be created
        # aws_appsync_graphql_api.main will be created
        # aws_appsync_resolver.create_note will be created
        # aws_appsync_resolver.delete_note will be created
        # aws_appsync_resolver.note will be created
        # aws_appsync_resolver.notes will be created
        # aws_appsync_resolver.update_note will be created
        # aws_dynamodb_table.main will be created
        # aws_iam_role.appsync_datasource_dynamodb will be created
        # aws_iam_role.appsync_logging will be created
        # aws_iam_role_policy.appsync_datasource_dynamodb_dynamodb will be created
        # aws_iam_role_policy.appsync_logging_logs will be created
      
      $ terraform apply

  - as: check
    cap: 動作確認
    title: APIキーの発行
    description: |
      では実際にGraphQLのリクエストを投げていきますが、
      その前にまずAPIキーを発行します。
    image: size=(min) create-apikey.png

  - title: GraphQLリクエスト
  - description: |
      では実際にリクエストを投げていきます。
      まずはデータの作成です。
    inline:
      open: graphql-create.gql
  - image: size=(min) graphql-create.png
  - description: つづいて更新です。
    image: size=(min) graphql-update.png
  - description: 一覧
    image: size=(min) graphql-list.png
  - description: 詳細
    image: size=(min) graphql-get.png
  - description: 削除
    image: size=(min) graphql-delete.png
  